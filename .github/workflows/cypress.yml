name: Cypress Testing

on:
  push:
    branches:
      - cypress-testing
  pull_request:
    branches:
      - cypress-testing

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Run Cypress tests (install handled by action, cached automatically)
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: true
          browser: chrome
          headed: false
